<h1>Sign in</h1>

<section class="demo" aria-labelledby="demo-heading">
  <h2 id="demo-heading">Explore as a demo client</h2>
  <p>No account needed. Each demo client has synthetic accounts and activity, reset daily.</p>

  <ul class="personas">
    @for (persona of personas; track persona.key) {
      <li class="persona">
        <button
          type="button"
          class="persona__button"
          [disabled]="busy()"
          (click)="signInAs(persona.key)"
        >
          Sign in as {{ persona.name }}
        </button>
        <p class="persona__summary">{{ persona.summary }}</p>
      </li>
    }
  </ul>

  @if (failed()) {
    <p class="error" role="alert">Sorry, we couldn't sign you in. Please try again.</p>
  }
</section>
