# Local, production-like stack: PostgreSQL 17 (the same major version as Neon) → migrations → the app image.
#
#   SOURCE_REVISION=$(git rev-parse HEAD) docker compose up --build
#   open http://localhost:8080
#
# Credentials below are for this throwaway local database only.
name: meridian

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian-local-dev
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrations:
    build:
      context: .
      target: migrations
    image: meridian-migrations:local
    command: ["--connection", "Host=db;Port=5432;Database=meridian;Username=meridian;Password=meridian-local-dev;GSS Encryption Mode=Disable"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    image: meridian:local
    environment:
      ConnectionStrings__Meridian: "Host=db;Port=5432;Database=meridian;Username=meridian;Password=meridian-local-dev"
      Demo__Enabled: "true" # seed the synthetic personas (Dana, Raj) on startup
      Auth__SecureCookies: "false" # local stack is plain HTTP; Azure (HTTPS) keeps the default: Secure cookies
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    # The chiseled image has no shell or curl, so there is no container HEALTHCHECK here.
    # Probes hit /health/live and /health/ready from outside (Azure Container Apps, #12).

volumes:
  db-data:
