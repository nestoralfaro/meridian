name: infra

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # OIDC token for azure/login; no cloud secrets are stored in GitHub

concurrency:
  group: infra-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-meridian
  TARGET_ENV: ${{ inputs.environment || 'staging' }}

jobs:
  deploy:
    name: deploy (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    # environment: ${{ inputs.environment || 'staging' }}   # enable once the repo is public (approval gates + env secrets)
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Budget (resource-group wide)
        env:
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
        run: |
          if [ -z "$BUDGET_EMAIL" ]; then
            echo "::warning::BUDGET_EMAIL secret not set; skipping budget deployment"
            exit 0
          fi
          az deployment group create -g "$RESOURCE_GROUP" -n "budget-${GITHUB_RUN_ID}" \
            -f infra/budget.bicep -p infra/budget.bicepparam --only-show-errors -o none

      - name: What-if
        # ResourceIdOnly: list what changes without echoing property values (e.g. connection strings) into public logs
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" --result-format ResourceIdOnly \
            -f infra/main.bicep -p "infra/${TARGET_ENV}.bicepparam" \
            -p dbConnection="$DB_CONNECTION" --only-show-errors
        env:
          DB_CONNECTION: ${{ inputs.environment == 'production' && secrets.DB_CONNECTION_PRODUCTION || secrets.DB_CONNECTION_STAGING }}

      - name: Deploy
        id: deploy
        run: |
          url=$(az deployment group create -g "$RESOURCE_GROUP" -n "app-${TARGET_ENV}-${GITHUB_RUN_ID}" \
            -f infra/main.bicep -p "infra/${TARGET_ENV}.bicepparam" \
            -p dbConnection="$DB_CONNECTION" --only-show-errors \
            --query properties.outputs.url.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${TARGET_ENV}: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          DB_CONNECTION: ${{ inputs.environment == 'production' && secrets.DB_CONNECTION_PRODUCTION || secrets.DB_CONNECTION_STAGING }}

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "${{ steps.deploy.outputs.url }}"
