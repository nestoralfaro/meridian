name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', '.github/workflows/pages.yml']
  # Republish after every successful CI run on main so the test and coverage reports stay current.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download report artifacts from CI runs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Renders docs/ (Markdown) to HTML. Storybook, coverage and test reports are added here as they come online.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Add the latest CI reports (Playwright, coverage)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          run="${RUN_ID:-$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')}"
          if [ -z "$run" ]; then echo "No successful CI run on main yet"; exit 0; fi
          sudo mkdir -p _site/reports
          for artifact in playwright-report:e2e coverage-report:coverage; do
            name="${artifact%%:*}"; dir="${artifact##*:}"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "$name" -D "/tmp/$dir"; then
              sudo cp -r "/tmp/$dir" "_site/reports/$dir"
            else
              echo "::warning::artifact $name not found in run $run"
            fi
          done

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
