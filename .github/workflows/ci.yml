name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Source Link stamps the commit into the build; tests assert on it

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Meridian.slnx

      - name: Format
        run: dotnet format Meridian.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build Meridian.slnx -c Release --no-restore

      - name: Test (unit, architecture, integration + Reqnroll specs against PostgreSQL via Testcontainers)
        run: >
          dotnet test --solution Meridian.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --results-directory "$RUNNER_TEMP/test-results"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/test-results/*.cobertura.xml
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/meridian-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/meridian-web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: No high-severity npm advisories
        run: npm audit --omit=optional --audit-level=high

      - name: API types match the committed contract (openapi/meridian-v1.json)
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain -- src/app/core/api)" ]; then
            git status --porcelain -- src/app/core/api
            echo "::error::Generated API types are out of date. Run 'npm run api:generate' in src/meridian-web and commit the result."
            exit 1
          fi

      - name: Lint (TypeScript + template accessibility rules)
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Production build (bundle budgets enforced)
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/meridian-web/coverage/meridian-web/cobertura-coverage.xml
          if-no-files-found: error

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed; CD publishes it)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-contract:
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No breaking changes against the base branch (oasdiff)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "Only compared on pull requests."; exit 0; fi
          mkdir -p /tmp/contract
          if ! git show "origin/${BASE_REF}:openapi/meridian-v1.json" > /tmp/contract/base.json 2>/dev/null; then
            echo "No contract on ${BASE_REF} yet; nothing to compare."; exit 0
          fi
          cp openapi/meridian-v1.json /tmp/contract/revision.json
          # Deliberately accepted reports, each with a written reason (reviewed like any other change).
          touch /tmp/contract/ignore.txt
          [ -f openapi/oasdiff-err-ignore.txt ] && cp openapi/oasdiff-err-ignore.txt /tmp/contract/ignore.txt
          oasdiff() { docker run --rm -v /tmp/contract:/c tufin/oasdiff:v1.34.1 "$@"; }
          {
            echo "### API contract changes"
            oasdiff changelog /c/base.json /c/revision.json --format markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
          oasdiff breaking /c/base.json /c/revision.json --fail-on ERR --err-ignore /c/ignore.txt --format githubactions

  e2e:
    name: e2e + accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start the stack (PostgreSQL → migrations → app)
        working-directory: .
        run: |
          SOURCE_REVISION=${{ github.sha }} docker compose up -d --build
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/health/ready; then echo "ready"; exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - run: npm ci --no-audit --no-fund

      - name: No high-severity npm advisories
        run: npm audit --omit=optional --audit-level=high

      - run: npm run typecheck

      - name: Lint (web-first assertions, no fixed waits)
        run: npm run lint -- --max-warnings 0

      - run: npx playwright install --with-deps chromium webkit

      - name: Playwright (Chromium, WebKit, mobile) with axe WCAG 2.2 AA checks on every page
        run: npx playwright test

      - name: Container logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color | tail -200

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

  coverage:
    name: coverage report
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          path: coverage

      - name: Merge and summarize
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: coverage/**/*.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Html
          assemblyfilters: '+Meridian.*;+app*;-Meridian.*Tests*' # backend assemblies + Angular packages (app.*), minus tests
          classfilters: '-Meridian.Infrastructure.Persistence.Migrations.*;-app.core.api*' # generated code (EF migrations, OpenAPI types) inflates the figure
          title: Meridian coverage

      - name: Publish to job summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
