version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*', 'Microsoft.AspNetCore.*']
      testing:
        patterns: ['xunit*', 'Shouldly', 'TngTech.ArchUnitNET*', 'Microsoft.Testing.*']
  # Add npm and docker ecosystems when those manifests exist (#8, #10).
