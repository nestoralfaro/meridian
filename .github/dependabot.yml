version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*', 'Microsoft.AspNetCore.*']
      testing:
        patterns: ['xunit*', 'Shouldly', 'TngTech.ArchUnitNET*', 'Microsoft.Testing.*']
  - package-ecosystem: npm
    directory: /src/meridian-web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
      lint-and-test:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'jsdom']
    ignore:
      # Angular pins a narrow TypeScript range (@angular/compiler-cli 22.2: >=6.0 <6.1);
      # TypeScript moves with `ng update`, not independently. Patch updates are still allowed.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      e2e:
        patterns: ['*']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # The build stage tracks the Node LTS pinned in .nvmrc (Angular CLI 22: ^22.22.3 || ^24.15.0 || >=26).
      # Odd-numbered majors are non-LTS; Node moves deliberately with .nvmrc, not via Dependabot.
      - dependency-name: node
        update-types: ['version-update:semver-major']
