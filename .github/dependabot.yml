version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*', 'Microsoft.AspNetCore.*']
      testing:
        patterns: ['xunit*', 'Shouldly', 'TngTech.ArchUnitNET*', 'Microsoft.Testing.*']
  - package-ecosystem: npm
    directory: /src/meridian-web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
      lint-and-test:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'jsdom']
  # Add the docker ecosystem when the Dockerfile exists (#10).
