name: Spike
description: Time-boxed research to reduce uncertainty before committing to an approach.
title: "spike: "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: e.g. 4 hours
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to evaluate
  - type: textarea
    id: outcome
    attributes:
      label: Outcome (fill in when done; link the resulting ADR)
